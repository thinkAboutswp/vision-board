<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vision Board</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: #f5f2ec;
    min-height: 100vh;
    padding: 0;
  }

  .page-header {
    text-align: center;
    padding: 48px 24px 32px;
    background: #f5f2ec;
  }
  .page-header h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 52px;
    font-weight: 300;
    color: #2d3a2e;
    letter-spacing: -0.5px;
    line-height: 1;
  }
  .page-header h1 em {
    font-style: italic;
    color: #4a6741;
  }
  .page-header p {
    margin-top: 10px;
    font-size: 13px;
    color: #8a8a7e;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    grid-auto-rows: 80px;
    gap: 6px;
    padding: 0 24px 24px;
    max-width: 1100px;
    margin: 0 auto;
  }

  .cell {
    position: relative;
    overflow: hidden;
    border-radius: 6px;
    cursor: pointer;
    background: #e8e4db;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .cell:hover { transform: scale(1.015); box-shadow: 0 8px 32px rgba(0,0,0,0.18); z-index: 10; }

  .cell img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.4s ease;
  }
  .cell:hover img { transform: scale(1.05); }

  /* Upload overlay — shown when no image */
  .upload-hint {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 6px;
    background: #e8e4db;
    color: #aaa89a;
    font-size: 11px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    transition: background 0.2s;
    pointer-events: none;
  }
  .cell:hover .upload-hint { background: #dddad0; }
  .upload-hint svg { width: 20px; height: 20px; opacity: 0.5; }
  .cell.has-image .upload-hint { display: none; }

  /* Text overlays */
  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: flex-start; justify-content: flex-end;
    padding: 12px 14px;
    pointer-events: none;
  }
  .overlay.center { align-items: center; justify-content: center; text-align: center; }
  .overlay-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    color: #fff;
    font-weight: 300;
    line-height: 1.3;
    text-shadow: 0 1px 8px rgba(0,0,0,0.35);
    pointer-events: auto;
    background: transparent;
    border: none;
    width: 100%;
    resize: none;
    outline: none;
    cursor: text;
  }
  .overlay-text:focus { background: rgba(0,0,0,0.15); border-radius: 4px; }

  /* Solid text cells */
  .cell.text-cell {
    cursor: default;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
    text-align: center;
  }
  .cell.text-cell .text-edit {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(13px, 2vw, 22px);
    font-weight: 300;
    line-height: 1.4;
    color: inherit;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    width: 100%;
    text-align: center;
    cursor: text;
  }
  .cell.text-cell.green { background: #4a6741; color: #e8f0e5; }
  .cell.text-cell.cream { background: #f0ebe0; color: #3a3a2e; }
  .cell.text-cell.dark { background: #2d3a2e; color: #c8d4c0; }
  .cell.text-cell.sage { background: #7a9470; color: #f0f4ee; }
  .cell.text-cell.blush { background: #d4c4b0; color: #3a3020; }

  /* Remove button */
  .remove-btn {
    position: absolute; top: 6px; right: 6px;
    width: 22px; height: 22px;
    background: rgba(0,0,0,0.45);
    border: none; border-radius: 50%;
    color: #fff; font-size: 13px;
    cursor: pointer; display: none;
    align-items: center; justify-content: center;
    line-height: 1; z-index: 20;
  }
  .cell:hover .remove-btn { display: flex; }
  .cell.text-cell .remove-btn { display: none !important; }

  /* Hidden file input */
  input[type=file] { display: none; }

  /* Bottom bar */
  .bottom-bar {
    text-align: center;
    padding: 24px;
    font-size: 12px;
    color: #aaa89a;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  /* Drag over state */
  .cell.drag-over { outline: 2px dashed #4a6741; outline-offset: -2px; }
</style>
</head>
<body>

<div class="page-header">
  <h1>do it for your <em>future</em> self</h1>
  <p contenteditable="true" spellcheck="false">2025 · my vision board · click any cell to add a photo</p>
</div>

<div class="board" id="board">
  <!-- Row 1 — spans defined by col/row -->
  <!-- [col-start / col-end / row-start / row-end] in style -->
  <div class="cell" style="grid-column:1/5;grid-row:1/4;" data-slot="1"></div>
  <div class="cell" style="grid-column:5/9;grid-row:1/3;" data-slot="2"></div>
  <div class="cell text-cell green" style="grid-column:9/13;grid-row:1/2;"><textarea class="text-edit" spellcheck="false">clear skin · shiny hair
fit body · healthy mind</textarea></div>
  <div class="cell" style="grid-column:9/13;grid-row:2/4;" data-slot="3"></div>
  <div class="cell text-cell cream" style="grid-column:5/9;grid-row:3/4;"><textarea class="text-edit" spellcheck="false">i eat healthy for my skin.
my body. my mind. my energy.</textarea></div>

  <div class="cell" style="grid-column:1/4;grid-row:4/7;" data-slot="4"></div>
  <div class="cell text-cell dark" style="grid-column:4/7;grid-row:4/6;">
    <textarea class="text-edit" spellcheck="false" style="font-size:28px;font-style:italic;">do it for your
future self</textarea>
  </div>
  <div class="cell" style="grid-column:7/10;grid-row:4/7;" data-slot="5"></div>
  <div class="cell text-cell sage" style="grid-column:10/13;grid-row:4/5;"><textarea class="text-edit" spellcheck="false">be happy with what
you have while working
for what you want</textarea></div>
  <div class="cell" style="grid-column:4/7;grid-row:6/8;" data-slot="6"></div>
  <div class="cell" style="grid-column:10/13;grid-row:5/7;" data-slot="7"></div>

  <div class="cell" style="grid-column:1/4;grid-row:7/10;" data-slot="8"></div>
  <div class="cell text-cell blush" style="grid-column:4/7;grid-row:8/9;"><textarea class="text-edit" spellcheck="false">consistency is key</textarea></div>
  <div class="cell" style="grid-column:7/10;grid-row:7/9;" data-slot="9"></div>
  <div class="cell text-cell green" style="grid-column:10/13;grid-row:7/9;"><textarea class="text-edit" spellcheck="false">mind · body · skin</textarea></div>

  <div class="cell" style="grid-column:4/7;grid-row:9/11;" data-slot="10"></div>
  <div class="cell" style="grid-column:7/10;grid-row:9/12;" data-slot="11"></div>
  <div class="cell text-cell cream" style="grid-column:10/13;grid-row:9/11;"><textarea class="text-edit" spellcheck="false">don't wish for it,
work for it.</textarea></div>

  <div class="cell" style="grid-column:1/4;grid-row:10/12;" data-slot="12"></div>
  <div class="cell text-cell dark" style="grid-column:4/7;grid-row:11/12;"><textarea class="text-edit" spellcheck="false">in my wellness era</textarea></div>
  <div class="cell" style="grid-column:10/13;grid-row:11/13;" data-slot="13"></div>

  <div class="cell" style="grid-column:1/5;grid-row:12/14;" data-slot="14"></div>
  <div class="cell text-cell sage" style="grid-column:5/8;grid-row:12/13;"><textarea class="text-edit" spellcheck="false">i AM becoming the
BEST version of myself.</textarea></div>
  <div class="cell" style="grid-column:8/10;grid-row:12/14;" data-slot="15"></div>
</div>

<div class="bottom-bar">click any photo cell to upload · drag & drop supported · text cells are editable</div>

<input type="file" id="file-input" accept="image/*">

<script>
const board = document.getElementById('board');
const fileInput = document.getElementById('file-input');
let activeCell = null;

function makeUploadHint() {
  const h = document.createElement('div');
  h.className = 'upload-hint';
  h.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 16V8m0 0-3 3m3-3 3 3"/><rect x="3" y="3" width="18" height="18" rx="3"/></svg><span>photo</span>`;
  return h;
}

function makeRemoveBtn(cell) {
  const b = document.createElement('button');
  b.className = 'remove-btn';
  b.innerHTML = '×';
  b.title = 'Remove image';
  b.addEventListener('click', (e) => {
    e.stopPropagation();
    const img = cell.querySelector('img');
    if (img) { URL.revokeObjectURL(img.src); img.remove(); }
    cell.classList.remove('has-image');
    if (!cell.querySelector('.upload-hint')) cell.appendChild(makeUploadHint());
  });
  return b;
}

// Init photo cells
document.querySelectorAll('.cell[data-slot]').forEach(cell => {
  cell.appendChild(makeUploadHint());
  cell.appendChild(makeRemoveBtn(cell));

  cell.addEventListener('click', () => {
    activeCell = cell;
    fileInput.value = '';
    fileInput.click();
  });

  // Drag & drop
  cell.addEventListener('dragover', e => { e.preventDefault(); cell.classList.add('drag-over'); });
  cell.addEventListener('dragleave', () => cell.classList.remove('drag-over'));
  cell.addEventListener('drop', e => {
    e.preventDefault();
    cell.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) setImage(cell, file);
  });
});

fileInput.addEventListener('change', () => {
  if (fileInput.files[0] && activeCell) {
    setImage(activeCell, fileInput.files[0]);
  }
});

function setImage(cell, file) {
  const existing = cell.querySelector('img');
  if (existing) { URL.revokeObjectURL(existing.src); existing.remove(); }
  const img = document.createElement('img');
  img.src = URL.createObjectURL(file);
  img.alt = '';
  cell.insertBefore(img, cell.firstChild);
  cell.classList.add('has-image');
}

// Auto-resize textareas
document.querySelectorAll('textarea').forEach(ta => {
  ta.style.height = 'auto';
  ta.addEventListener('input', () => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; });
});
</script>
</body>
</html>
